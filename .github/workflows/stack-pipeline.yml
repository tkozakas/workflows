name: Stack Pipeline

on:
  workflow_call:
    inputs:
      image-suffix:
        type: string
        default: ""
      context:
        type: string
        default: "."
      dockerfile:
        type: string
        default: "deploy/Dockerfile"
      build-args:
        type: string
        default: ""
    secrets:
      deploy-token:
        required: false
      deploy-url:
        required: false

jobs:
  docker-build:
    name: Docker Build (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            tag: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            tag: linux-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository }}${{ inputs.image-suffix }}:${{ matrix.tag }}
          build-args: ${{ inputs.build-args }}
          provenance: false

  manifest:
    name: Manifest
    needs: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest
        run: |
          docker buildx imagetools create -t ghcr.io/${{ github.repository }}${{ inputs.image-suffix }}:main \
            ghcr.io/${{ github.repository }}${{ inputs.image-suffix }}:linux-amd64 \
            ghcr.io/${{ github.repository }}${{ inputs.image-suffix }}:linux-arm64

  deploy:
    name: Trigger Deploy
    needs: manifest
    runs-on: ubuntu-latest
    steps:
      - name: Trigger webhook
        env:
          DEPLOY_TOKEN: ${{ secrets.deploy-token }}
          DEPLOY_URL: ${{ secrets.deploy-url }}
        if: env.DEPLOY_TOKEN != '' && env.DEPLOY_URL != ''
        run: |
          for attempt in $(seq 1 10); do
            code=$(curl -sS -o /tmp/deploy-response -w '%{http_code}' -X POST \
              -H "Authorization: $DEPLOY_TOKEN" "$DEPLOY_URL" || echo 000)
            cat /tmp/deploy-response; echo
            case "$code" in
              2??)
                if grep -q "Deployment triggered" /tmp/deploy-response; then
                  exit 0
                fi
                echo "webhook did not trigger a deployment"
                exit 1
                ;;
              404)
                echo "::notice::no deploy webhook provisioned yet, run ansible to provision it"
                exit 0
                ;;
            esac
            sleep 15
          done
          exit 1
